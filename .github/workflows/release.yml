name: release

# Release CI for perl-wasm. Triggered only by a `v*` tag, it runs the exact same
# wasmify pipeline as build.yml (so the released artifacts are rebuilt from the
# tagged source, not promoted from an unverified earlier run), stages the five
# release assets, attaches SLSA build-provenance attestations, and creates the
# GitHub Release.
#
# Assets (mirrors python-wasm's asset set, adapted for perl-wasm):
#   * perl.wasm            — raw wasi-sdk artifact (binaryen-optimised).
#   * perl_wasm2go.go      — protoc-gen-wasmify-go's wasm2go bridge.
#   * perl_wasm2go.tar.gz  — the build/wasm2go/internal/wasm2go bundle, a
#                            self-contained Go module after bundle-gomod, which
#                            go-perl downloads and extracts.
#   * perl_wasm2go.sha256  — sha256sum manifest of the tarball contents; doubles
#                            as the attestation subject-checksums so any extracted
#                            file verifies individually.
#   * perl_stdlib.zip      — the assembled pure-Perl stdlib (perl5/lib), locked to
#                            the pinned perl5 submodule version, that go-perl
#                            unpacks and passes to perl_new(lib_dir) as @INC.
#
# Releasing lives ONLY here, never in build.yml — so pull requests and main
# pushes build and verify but never publish. No `tags:` trigger in build.yml
# means a tag push runs this workflow alone (no double build, no race).
#
# The toolchain (wasi-sdk, binaryen, buf, the wasmify CLI) lives inside the
# wasmify base image, so the build runs entirely in a container; the
# project-specific cache image (pushed by build.yml on main) is read for warmth
# when present. `docker run` (not the GHA `container:` directive) so a
# free-disk-space step can run on the host before the container starts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # create the GitHub Release + upload assets
  packages: read           # read the cache image from ghcr (never pushed here)
  id-token: write          # actions/attest-build-provenance OIDC token
  attestations: write

env:
  # Keep in lock-step with build.yml. The tag is baked into the cache key so a
  # wasmify upgrade rolls the cache forward cleanly.
  WASMIFY_IMAGE: ghcr.io/goccy/wasmify:v0.6.11
  CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/perl-wasm-cache

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve cache image tag from wasmify version + perl5 submodule SHA
        id: cache_key
        run: |
          submodule_sha=$(git -C perl5 rev-parse HEAD)
          wasmify_tag="${WASMIFY_IMAGE##*:}"
          if [ -z "$wasmify_tag" ] || [ "$wasmify_tag" = "$WASMIFY_IMAGE" ]; then
            wasmify_tag="untagged"
          fi
          echo "tag=${CACHE_IMAGE}:${wasmify_tag}-${submodule_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Try to pull cache image
        # A warm cache (built by build.yml on the same perl5 SHA) lets the host
        # miniperl build + the .wasmify object cache short-circuit. A miss is not
        # a failure — release.yml never writes the cache, it only reads it.
        id: cache_pull
        continue-on-error: true
        run: |
          if docker pull "${{ steps.cache_key.outputs.tag }}"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore generated files from cache image (warm path)
        if: steps.cache_pull.outputs.hit == 'true'
        run: |
          container=$(docker create "${{ steps.cache_key.outputs.tag }}")
          docker cp "${container}:/cache/output/." "$PWD/"
          docker rm -f "${container}"
          ls -la .wasmify build/host-perl 2>/dev/null | head -10 || true

      - name: Resolve build base image
        id: base
        run: |
          if [ "${{ steps.cache_pull.outputs.hit }}" = "true" ]; then
            echo "image=${{ steps.cache_key.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            docker pull "$WASMIFY_IMAGE"
            echo "image=$WASMIFY_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run wasmify pipeline
        # Identical to build.yml's pipeline — the released artifacts are rebuilt
        # from the tagged source. `buf generate --timeout 30m` overrides buf's
        # 2-minute plugin timeout (the wasm2go flavour SSA-lowers a large wasm).
        run: |
          docker run -d --name wasmify-build \
            -v "$PWD:/work" -w /work \
            -e WASMIFY_NON_INTERACTIVE=1 \
            --entrypoint sleep \
            "${{ steps.base.outputs.image }}" infinity
          docker exec wasmify-build bash -ceuxo pipefail '
            make tools
            bash scripts/wasi-configure.sh
            wasmify build --non-interactive
            wasmify generate-build
            wasmify parse-headers --header pl.h
            wasmify gen-proto
            wasmify wasm-build --optimize --non-interactive
            # Clean tree before buf generate: protoc-gen-wasmify-go overwrites
            # but never deletes, and the bundle file SET depends on the wasm size
            # (single- vs multi-package layout).
            rm -rf build
            buf generate --timeout 30m
            make bundle-gomod
          '

      - name: Stop build container
        if: always()
        run: docker rm -f wasmify-build 2>/dev/null || true

      - name: Stage release artifacts
        run: |
          mkdir -p release
          cp .wasmify/wasm-build/output/perl.wasm release/perl.wasm
          cp build/wasm2go/perl.go release/perl_wasm2go.go
          tar -czf release/perl_wasm2go.tar.gz -C build/wasm2go/internal/wasm2go .
          ( cd build/wasm2go/internal/wasm2go && find . -type f -print0 | sort -z \
              | xargs -0 sha256sum ) > release/perl_wasm2go.sha256
          # perl5/lib here is the bind-mounted tree the pipeline assembled above
          # (the dual-life modules copied in + the generated Config.pm), so the
          # zip carries the same stdlib perl.wasm was built from. Guard it: a
          # pristine perl5/lib has no generated Config.pm, which would ship an
          # incomplete stdlib go-perl silently loads.
          python3 scripts/make-stdlib-zip.py perl5/lib release/perl_stdlib.zip
          # Config_heavy.pl is written to lib/ by the build (configpm); a pristine
          # perl5/lib has neither it nor the dual-life modules, so its presence
          # proves the zip is the assembled tree perl.wasm was built from.
          unzip -l release/perl_stdlib.zip | grep -q 'Config_heavy\.pl' \
            || { echo "::error::perl_stdlib.zip has no generated Config_heavy.pl — built from a pristine perl5/lib, not the assembled tree"; exit 1; }

      - uses: actions/attest-build-provenance@v2
        # Provenance for the wasm + the wasm2go bridge + the stdlib zip. Skipped
        # on user-owned private repos (the attestations API rejects those);
        # re-enables itself when the repo is public.
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            release/perl.wasm
            release/perl_wasm2go.go
            release/perl_stdlib.zip

      - uses: actions/attest-build-provenance@v2
        # wasm2go bundle: one attestation whose subjects are the per-file digests
        # in the manifest, so any file extracted from the tarball verifies
        # individually.
        if: github.event.repository.visibility == 'public'
        with:
          subject-checksums: release/perl_wasm2go.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/perl.wasm
            release/perl_wasm2go.go
            release/perl_wasm2go.tar.gz
            release/perl_wasm2go.sha256
            release/perl_stdlib.zip
